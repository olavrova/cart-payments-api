services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: cart_payments
    ports:
      - "5433:5432"
    volumes:
      # Files here run once, in name order, when the data directory is empty.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d cart_payments"]
      interval: 2s
      timeout: 3s
      retries: 15
