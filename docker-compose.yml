services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: cart_payments
    ports:
      # Local machine only; 5433 avoids a clash with a local PostgreSQL on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      # Runs only when pgdata is empty. After changing a migration:
      #   docker compose down -v && docker compose up -d --wait
      - ./docker/initdb.sh:/docker-entrypoint-initdb.d/initdb.sh:ro
    healthcheck:
      # -h localhost: check over TCP. During init the server listens only on
      # the Unix socket, so this check passes only after migrations are applied.
      test: ["CMD-SHELL", "pg_isready -h localhost -U shop -d cart_payments"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
